name: Update profile README

on:
  schedule:
    # Offset from :00 to avoid GitHub Actions queue spikes.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=dark&hide_border=true&bg_color=000000&title_color=FF6B00&text_color=FFFFFF&icon_color=FF6B00&count_private=false
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github
            assets/snake-dark.svg?palette=github-dark&color_snake=FF6B00

      - name: Generate contribution streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.8.0
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=000000&border=000000&ring=000000&fire=FF6B00&currStreakLabel=888888&sideLabels=888888&dates=888888&disable_animations=true
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore(profile): refresh GitHub stats cards"
          git pull --rebase origin main
          git push
