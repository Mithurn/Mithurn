name: Update profile README

on:
  schedule:
    # Offset from :00 to avoid GitHub Actions queue spikes.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-readme.yml"

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&count_private=false
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=radical&hide_border=true&count_private=false
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.8.0
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=000000&border=000000&ring=000000&fire=FF6B00&currStreakLabel=888888&sideLabels=888888&dates=888888&disable_animations=true
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp README last-updated marker
        run: |
          timestamp="$(date -u '+%d %b %Y %H:%M UTC')"
          awk -v ts="$timestamp" '
            /<!-- PROFILE-README:UPDATED:START -->/ {
              print
              print "<sub>Last updated by github-actions[bot]: " ts "</sub>"
              skip=1
              next
            }
            /<!-- PROFILE-README:UPDATED:END -->/ {
              skip=0
              print
              next
            }
            skip { next }
            { print }
          ' README.md > README.tmp
          mv README.tmp README.md

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore(profile): refresh GitHub stats cards"
          git pull --rebase origin main
          git push
